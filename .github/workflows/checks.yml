name: Toolbox checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolbox-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-browser-tests.txt
            backend/requirements-quality.txt
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: UI lint, types, tests and build
        working-directory: ui
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Python and browser dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-browser-tests.txt -r backend/requirements-quality.txt
          python -m playwright install --with-deps chromium
      - name: Python correctness checks
        run: python -m ruff check backend
      - name: Backend and browser tests
        # Windows packaging/offline-PDF integration remains in build-windows.yml.
        run: python -m pytest backend/tests -q
      - name: BIM2STEIGER calculation tests
        working-directory: backend/bim2steiger
        run: python -m unittest discover -s tests -q
