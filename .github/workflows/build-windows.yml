name: 'Toolbox: Windows-Setup bauen'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toolbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: packaging/pdf-runtime-cache
          key: windows-pdf-runtime-${{ hashFiles('packaging/pdf-runtime.lock.json') }}
      - name: Buildnummer und Quellstand hinterlegen
        id: version
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          number = int(os.environ['GITHUB_RUN_NUMBER'])
          commit = os.environ['GITHUB_SHA']
          Path('backend/edeco_toolbox/_build.py').write_text(
              f'BUILD = {number}\nCOMMIT = {commit!r}\n', encoding='utf-8')
          Path('backend/nova_legend/_build.py').write_text(f'BUILD = {number}\n', encoding='utf-8')
          sys.path.insert(0, 'backend')
          from edeco_toolbox import APP_VERSION
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={APP_VERSION}\n')
      - name: Oberfläche testen und bauen
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Python und Browsertests vorbereiten
        run: |
          python -m pip install -r backend/requirements.txt -r packaging/requirements-windows.txt -r backend/requirements-browser-tests.txt
          python -m playwright install chromium
      - name: Vollständige Offline-PDF-Laufzeit vorbereiten
        run: python packaging/prepare_pdf_runtime.py
      - name: Externe Netzverbindungen der PDF-Engine für Tests sperren
        shell: pwsh
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $engine = (Resolve-Path 'packaging/pdf-runtime/java/bin/java.exe').Path
          New-NetFirewallRule -DisplayName 'edeco PDF offline test' -Direction Outbound -Action Block -Program $engine -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3','fc00::/7','fe80::/10' | Out-Null
      - name: Windows-PDF-Verarbeitung ohne externen Dienst prüfen
        env:
          EDECO_TEST_PDF_RUNTIME: '1'
          EDECO_TOOLBOX_HOME: '${{ runner.temp }}/pdf-runtime-tests'
        run: python -m pytest backend/tests/test_pdf_stirling_live.py backend/tests/test_pdf_runtime.py -q --junitxml=output/pdf-runtime-tests.xml
      - name: KI-Serverhilfe auf Syntax prüfen
        shell: pwsh
        run: |
          $kiParseTokens = $null
          $kiParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/ki-server/Start-KI-Server.ps1').Path, [ref]$kiParseTokens, [ref]$kiParseErrors) | Out-Null
          if ($kiParseErrors.Count) { throw ($kiParseErrors | Out-String) }
      - name: Backend und Browser testen
        run: python -m pytest backend/tests -q
      - name: BIM2STEIGER-Fachlogik testen
        working-directory: backend/bim2steiger
        run: python -m unittest discover -s tests -q
      - name: Toolbox-EXE bauen
        run: |
          python packaging/make_toolbox_icon.py
          pyinstaller packaging/edeco_toolbox.spec --noconfirm
      - name: EXE auf Start und Oberfläche prüfen
        shell: pwsh
        run: |
          $engine = (Resolve-Path 'dist/edeco-Toolbox/_internal/pdf-runtime/java/bin/java.exe').Path
          New-NetFirewallRule -DisplayName 'edeco packaged PDF offline test' -Direction Outbound -Action Block -Program $engine -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3','fc00::/7','fe80::/10' | Out-Null
          $env:NOVA_LEGENDEN_HOME = "$env:RUNNER_TEMP\toolbox-home"
          $p = Start-Process -FilePath 'dist\edeco-Toolbox\edeco-Toolbox.exe' -ArgumentList '--server','--port','8799' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:8799/api/toolbox/status'
                $ok = $status.name -eq 'edeco Toolbox'
                if ($ok) { break }
              } catch { Start-Sleep 1 }
            }
            if (-not $ok) { throw 'Toolbox startet nicht' }
            if ($status.build -ne [int]$env:GITHUB_RUN_NUMBER -or $status.commit -ne $env:GITHUB_SHA) { throw 'Falsche Buildkennung in der EXE' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8799/' -UseBasicParsing
            if ($page.Content -notmatch 'edeco Toolbox') { throw 'Toolbox-Oberfläche fehlt' }
            $nova = Invoke-RestMethod 'http://127.0.0.1:8799/api/status'
            if (-not $nova.version) { throw 'Nova-Modul nicht verfügbar' }
            $bim = Invoke-RestMethod 'http://127.0.0.1:8799/tools/bim2steiger/api/meta'
            if ($bim.catalogue_articles -lt 1) { throw 'BIM-Katalog fehlt' }
            $env:EDECO_TEST_TOOLBOX_URL = 'http://127.0.0.1:8799'
            python -m pytest backend/tests/test_pdf_stirling_live.py backend/tests/test_pdf_packaged_ui.py -q --junitxml=output/pdf-exe-tests.xml
            if ($LASTEXITCODE) { throw 'PDF-Verarbeitung oder Oberfläche in der EXE fehlgeschlagen' }
            $env:DOC_SMOKE_FILE = Join-Path $env:RUNNER_TEMP 'document-source-smoke.pdf'
            @'
          import os, sys
          from pathlib import Path
          sys.path[:0] = ['backend', 'backend/tests']
          from test_documents import sample_pdf
          Path(os.environ['DOC_SMOKE_FILE']).write_bytes(sample_pdf())
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'PDF-Testdatei konnte nicht erstellt werden' }
            $docRoot = 'http://127.0.0.1:8799/api/tools/dokumenten-assistent'
            $toolboxSession = Invoke-RestMethod 'http://127.0.0.1:8799/api/toolbox/session'
            $docState = Invoke-RestMethod ($docRoot + '/state')
            $docHeaders = @{ 'X-Edeco-Documents' = $docState.session_key; 'X-Edeco-Session' = $toolboxSession.session_key }
            $uploaded = Invoke-RestMethod ($docRoot + '/documents') -Method Post -Headers $docHeaders -Form @{ file = Get-Item $env:DOC_SMOKE_FILE; edition = 'Synthetischer Buildtest' }
            $question = @{ question = 'Schutzleiter'; document_ids = @($uploaded.document.id); use_ai = $false } | ConvertTo-Json -Compress
            $answer = Invoke-RestMethod ($docRoot + '/ask') -Method Post -Headers $docHeaders -ContentType 'application/json' -Body $question
            if ($answer.sources.Count -ne 1 -or $answer.sources[0].page -ne 2) { throw 'PDF-Fundstelle in der EXE fehlt' }
            $original = Invoke-RestMethod ($docRoot + '/documents/' + $uploaded.document.id + '/pages/2') -Headers $docHeaders
            if ($original.image -notmatch '^data:image/png;base64,' -or -not $original.lines[0].box) { throw 'PDF-Vorschau oder Markierungskoordinaten fehlen in der EXE' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Nativen Fensterstart mit Download-Markierung prüfen
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/edeco-Toolbox/edeco-Toolbox.exe').Path
          $config = $exe + '.config'
          if (-not (Test-Path $config)) { throw '.NET-Konfiguration fehlt neben der EXE' }
          Get-ChildItem 'dist/edeco-Toolbox' -Recurse -Filter '*.dll' | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $env:NOVA_LEGENDEN_HOME = Join-Path $env:RUNNER_TEMP 'native-nova-smoke'
          $env:EDECO_TOOLBOX_HOME = Join-Path $env:RUNNER_TEMP 'native-baseline-smoke'
          Move-Item $config ($config + '.disabled')
          try {
            $p = Start-Process -FilePath $exe -ArgumentList '--desktop-smoke-test','--port','8797' -PassThru
            if (-not $p.WaitForExit(210000)) { Stop-Process -Id $p.Id -Force; throw 'Baseline-Fensterstart hängt' }
            Write-Host "Download-Markierung ohne Anwendungskonfiguration: Exitcode $($p.ExitCode)"
          } finally { Move-Item ($config + '.disabled') $config }
          $env:EDECO_TOOLBOX_HOME = Join-Path $env:RUNNER_TEMP 'native-fixed-smoke'
          $p = Start-Process -FilePath $exe -ArgumentList '--desktop-smoke-test','--port','8797' -PassThru
          if (-not $p.WaitForExit(210000)) { Stop-Process -Id $p.Id -Force; throw 'Nativer Fensterstart hängt' }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:EDECO_TOOLBOX_HOME\toolbox.log" -Tail 60
            throw 'Nativer Fensterstart fehlgeschlagen'
          }
          $report = Get-Content "$env:EDECO_TOOLBOX_HOME\desktop-smoke.json" -Raw | ConvertFrom-Json
          if (-not $report.ok -or $report.tool_count -ne 10 -or -not $report.pdf_ready) { throw 'Toolbox oder PDF-Werkstatt wurde im Programmfenster nicht gerendert' }
      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" packaging\toolbox-setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fehlgeschlagen' }
      - name: Installation und Aktualisierung prüfen
        shell: pwsh
        run: |
          $setup = (Get-ChildItem 'dist-installer/edeco-Toolbox-Setup-*.exe' | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'toolbox-install-smoke'
          $env:EDECO_TOOLBOX_HOME = Join-Path $env:RUNNER_TEMP 'toolbox-profile-smoke'
          $env:NOVA_LEGENDEN_HOME = Join-Path $env:RUNNER_TEMP 'toolbox-nova-smoke'
          New-Item -ItemType Directory -Force "$env:EDECO_TOOLBOX_HOME\webview" | Out-Null
          $marker = "$env:EDECO_TOOLBOX_HOME\webview\profile-marker.txt"
          Set-Content $marker 'keep-profile'
          for ($pass = 0; $pass -lt 2; $pass++) {
            $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NoAutoRun=1',"/DIR=`"$installDir`"" -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "Installation fehlgeschlagen: $($installer.ExitCode)" }
            if ((Get-Content $marker).Trim() -ne 'keep-profile') { throw 'Benutzerprofil wurde verändert' }
            if (-not (Test-Path "$installDir\_internal\packaging\toolbox.ico")) { throw 'Toolbox-Icon fehlt' }
            New-NetFirewallRule -DisplayName 'edeco installed PDF offline test' -Direction Outbound -Action Block -Program "$installDir\_internal\pdf-runtime\java\bin\java.exe" -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3','fc00::/7','fe80::/10' | Out-Null
            $p = Start-Process -FilePath "$installDir\edeco-Toolbox.exe" -ArgumentList '--server','--port','8798' -PassThru
            try {
              $ok = $false
              for ($i = 0; $i -lt 60; $i++) {
                try {
                  $status = Invoke-RestMethod 'http://127.0.0.1:8798/api/toolbox/updates'
                  if ($status.installed) { $ok = $true; break }
                } catch { Start-Sleep 1 }
              }
              if (-not $ok) { throw 'Installierte Toolbox startet nicht' }
              $env:EDECO_TEST_TOOLBOX_URL = 'http://127.0.0.1:8798'
              python -m pytest backend/tests/test_pdf_stirling_live.py -q
              if ($LASTEXITCODE) { throw 'Installierte PDF-Laufzeit fehlgeschlagen' }
            } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $gui = Start-Process -FilePath "$installDir\edeco-Toolbox.exe" -ArgumentList '--desktop-smoke-test','--port','8796' -PassThru
            if (-not $gui.WaitForExit(210000)) { Stop-Process -Id $gui.Id -Force; throw 'Installiertes Programmfenster hängt' }
            if ($gui.ExitCode -ne 0) {
              Get-Content "$env:EDECO_TOOLBOX_HOME\toolbox.log" -Tail 60
              throw 'Installiertes Programmfenster startet nicht'
            }
          }
      - name: Portable Ausgabe und Release-Text erstellen
        shell: pwsh
        run: |
          python packaging/make_portable.py --version '${{ steps.version.outputs.version }}'
          Compress-Archive -Path 'packaging/ki-server/*' -DestinationPath 'dist-installer/edeco-KI-Server-Einrichtung-${{ steps.version.outputs.version }}.zip' -CompressionLevel Optimal
          Copy-Item TOOLBOX_NEUIGKEITEN.md release-body.md
          Add-Content release-body.md "`n`nBuild $env:GITHUB_RUN_NUMBER · Commit $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pdf-test-results-${{ github.run_number }}
          path: output/
      - name: Prüfsummen erstellen
        shell: pwsh
        run: |
          Get-ChildItem 'dist-installer/*' | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object {
            if ($_.Length -gt 1900MB) { throw "Release-Asset überschreitet die Paketgrenze: $($_.Name)" }
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path ($_.FullName + '.sha256') -Value ($hash + '  ' + $_.Name) -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: edeco-Toolbox-Setup-Build-${{ github.run_number }}
          path: dist-installer/edeco-Toolbox-Setup-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: edeco-Toolbox-portabel-Build-${{ github.run_number }}
          path: dist-installer/edeco-Toolbox-Portable-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Toolbox unter Releases veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: edeco Toolbox ${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          files: dist-installer/*
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
