name: 'Toolbox: Windows-Setup bauen'

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Buildnummer und Quellstand hinterlegen
        id: version
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          number = int(os.environ['GITHUB_RUN_NUMBER'])
          commit = os.environ['GITHUB_SHA']
          Path('backend/edeco_toolbox/_build.py').write_text(
              f'BUILD = {number}\nCOMMIT = {commit!r}\n', encoding='utf-8')
          Path('backend/nova_legend/_build.py').write_text(f'BUILD = {number}\n', encoding='utf-8')
          sys.path.insert(0, 'backend')
          from edeco_toolbox import APP_VERSION
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={APP_VERSION}\n')
      - name: Oberfläche testen und bauen
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Python und Browsertests vorbereiten
        run: |
          python -m pip install -r backend/requirements.txt -r packaging/requirements-windows.txt -r backend/requirements-browser-tests.txt
          python -m playwright install chromium
      - name: Backend und Browser testen
        run: python -m pytest backend/tests -q
      - name: BIM2STEIGER-Fachlogik testen
        working-directory: backend/bim2steiger
        run: python -m unittest discover -s tests -q
      - name: Toolbox-EXE bauen
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/edeco_toolbox.spec --noconfirm
      - name: EXE auf Start und Oberfläche prüfen
        shell: pwsh
        run: |
          $env:NOVA_LEGENDEN_HOME = "$env:RUNNER_TEMP\toolbox-home"
          $p = Start-Process -FilePath 'dist\edeco-Toolbox\edeco-Toolbox.exe' -ArgumentList '--server','--port','8799' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:8799/api/toolbox/status'
                $ok = $status.name -eq 'edeco Toolbox'
                if ($ok) { break }
              } catch { Start-Sleep 1 }
            }
            if (-not $ok) { throw 'Toolbox startet nicht' }
            if ($status.build -ne [int]$env:GITHUB_RUN_NUMBER -or $status.commit -ne $env:GITHUB_SHA) { throw 'Falsche Buildkennung in der EXE' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8799/' -UseBasicParsing
            if ($page.Content -notmatch 'edeco Toolbox') { throw 'Toolbox-Oberfläche fehlt' }
            $nova = Invoke-RestMethod 'http://127.0.0.1:8799/api/status'
            if (-not $nova.version) { throw 'Nova-Modul nicht verfügbar' }
            $bim = Invoke-RestMethod 'http://127.0.0.1:8799/tools/bim2steiger/api/meta'
            if ($bim.catalogue_articles -lt 1) { throw 'BIM-Katalog fehlt' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" packaging\toolbox-setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup fehlgeschlagen' }
      - name: Installer-Prüfsumme erstellen
        shell: pwsh
        run: |
          Get-ChildItem 'dist-installer/edeco-Toolbox-Setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path ($_.FullName + '.sha256') -Value ($hash + '  ' + $_.Name) -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: edeco-Toolbox-Setup-Build-${{ github.run_number }}
          path: dist-installer/edeco-Toolbox-Setup-*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: edeco-Toolbox-portabel-Build-${{ github.run_number }}
          path: dist/edeco-Toolbox/
          if-no-files-found: error
          retention-days: 30
